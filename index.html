/* ===== Confetti ===== */
.confetti-piece{
  position:fixed; top:-14px; z-index:999; border-radius:2px; pointer-events:none;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  0%{ transform:translateY(0) rotate(0deg); opacity:1; }
  100%{ transform:translateY(100vh) rotate(540deg); opacity:0; }
}

/* ===== Playful hover motion ===== */
.nav-item, .mod-card, .btn, .navbtn{ transition:transform 0.18s cubic-bezier(.34,1.56,.64,1), background 0.15s ease, border-color 0.15s ease, box-shadow 0.2s ease; }
.mod-card:hover{ transform:translateX(3px) scale(1.012); box-shadow:0 6px 18px rgba(33,30,20,0.08); }
.nav-item:hover{ transform:translateX(2px); }
.btn:hover{ transform:translateY(-2px) scale(1.02); }

/* ===== Layout shell ===== */
.shell{ display:flex; min-height:100vh; }
.sidebar{
  width:288px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:1.7rem 1.3rem 2.5rem;
}
.brand{ display:flex; align-items:baseline; gap:0.5rem; margin-bottom:0.2rem;  }
.brand-mark{ font-family:var(--ff-display); font-weight:700; font-size:1.5rem; letter-spacing:-0.01em; }
.brand-mark em{ font-style:italic; font-weight:600; color:var(--apricot-deep); }
.brand-sub{ font-family:var(--ff-ui); font-size:0.72rem; color:var(--ink-soft); margin-bottom:1.7rem; letter-spacing:0.01em; }

.nav-label{ font-family:var(--ff-ui); font-size:0.66rem; font-weight:600; letter-spacing:0.09em; text-transform:uppercase; color:var(--olive); margin:1.3rem 0 0.5rem 0.2rem; }
.nav-item{
  display:flex; align-items:center; gap:0.6rem; padding:0.55rem 0.6rem; border-radius:8px;
  font-family:var(--ff-ui); font-size:0.86rem; color:var(--ink);  transition:background 0.15s ease;
}
.nav-item:hover{ background:var(--melon-bg); }
.nav-item.active{ background:linear-gradient(135deg,var(--olive),var(--olive-deep)); color:#FFFFFF; font-weight:600; box-shadow:0 3px 10px rgba(0,130,251,0.28); }
.nav-num{
  font-family:var(--ff-ui); font-weight:700; font-size:0.68rem; width:20px; height:20px; border-radius:50%;
  background:var(--sky-bg); color:var(--olive-deep); display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.nav-item.active .nav-num{ background:rgba(255,255,255,0.28); color:#FFFFFF; }
.nav-item.done .nav-num::after{ content:'✓'; }
.nav-item.done .nav-num{ background:var(--olive); color:#fff; font-size:0; }
.nav-item.done .nav-num::after{ font-size:0.68rem; }
.nav-title{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.progress-wrap{ margin-top:1.6rem; padding-top:1.2rem; border-top:1px solid var(--line); }
.progress-label{ font-family:var(--ff-ui); font-size:0.68rem; color:var(--ink-soft); margin-bottom:0.4rem; display:flex; justify-content:space-between; }
.progress-track{ height:7px; background:var(--line); border-radius:100px; overflow:hidden; }
.progress-fill{ height:100%; background:linear-gradient(90deg,#8ED2FF,#0082FB,#0064E0,#1C2B33); background-size:400% 100%; border-radius:100px; transition:width 0.5s cubic-bezier(.34,1.56,.64,1); }

.menu-btn{ display:none; }

/* ===== Main content ===== */
.main{ flex:1; min-width:0; }
.content{ max-width:760px; margin:0 auto; padding:3.4rem 2rem 6rem; }

/* Home */
.hero-eyebrow{ font-family:var(--ff-ui); font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--olive); margin-bottom:1rem; }
.hero h1{ font-family:var(--ff-display); font-weight:700; font-size:clamp(2.2rem,5vw,3.3rem); line-height:1.08; margin-bottom:1.1rem; }
.hero h1 em{
  font-style:italic; font-weight:600;
  background:linear-gradient(100deg,var(--apricot),var(--apricot-deep));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero{ position:relative; }
.hero::before{
  content:''; position:absolute; top:-4rem; left:-6rem; width:340px; height:340px; border-radius:50%;
  background:radial-gradient(circle, rgba(0,130,251,0.16), transparent 70%);
  z-index:-1; animation:floatGlow 7s ease-in-out infinite;
}
.hero::after{
  content:''; position:absolute; top:2rem; right:-4rem; width:260px; height:260px; border-radius:50%;
  background:radial-gradient(circle, rgba(0,100,224,0.13), transparent 70%);
  z-index:-1; animation:floatGlow 9s ease-in-out infinite reverse;
}
@keyframes floatGlow{ 0%,100%{ transform:translateY(0) scale(1); } 50%{ transform:translateY(18px) scale(1.06); } }
.hero p.lede{ font-family:var(--ff-body); font-size:1.05rem; color:var(--ink-soft); max-width:560px; margin-bottom:2rem; }
.btn{
  display:inline-flex; align-items:center; gap:0.5rem; font-family:var(--ff-ui); font-weight:600; font-size:0.9rem;
  background:linear-gradient(135deg,var(--apricot),var(--apricot-deep)); color:#FFFFFF; padding:0.8rem 1.5rem; border-radius:9px; border:none; box-shadow:0 4px 14px rgba(0,130,251,0.32); 
  transition:transform 0.15s ease, background 0.15s ease;
}
.btn:hover{ background:var(--apricot-deep); transform:translateY(-1px); }
.btn.ghost{ background:transparent; border:1.5px solid var(--line); color:var(--ink); }
.btn.ghost:hover{ background:var(--sky-bg); border-color:var(--sky); }

.stat-strip{ display:flex; gap:0; margin:2.4rem 0 2.8rem; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.stat{ flex:1; padding:1.1rem 1.3rem 1.1rem 0; }
.stat b{ font-family:var(--ff-display); font-size:1.7rem; display:block; }
.stat span{ font-family:var(--ff-ui); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); }

.mod-grid{ display:flex; flex-direction:column; gap:0.85rem; }
.mod-card{
  display:flex; gap:1rem; align-items:flex-start; padding:1.1rem 1.3rem; border-radius:12px;
  border:1px solid var(--line); background:var(--panel);  transition:border-color 0.15s ease, transform 0.15s ease;
}
.mod-card:hover{ border-color:var(--apricot); transform:translateX(2px); }
.mod-card .num{ font-family:var(--ff-display); font-weight:700; font-size:1.5rem; color:var(--sky); flex-shrink:0; width:2.2rem; }
.mod-card .txt h3{ font-family:var(--ff-display); font-weight:600; font-size:1.12rem; margin-bottom:0.25rem; }
.mod-card .txt p{ font-family:var(--ff-ui); font-size:0.85rem; color:var(--ink-soft); line-height:1.5; }
.mod-card .mins{ font-family:var(--ff-ui); font-size:0.68rem; color:var(--olive); white-space:nowrap; margin-left:auto; padding-top:0.3rem; }

/* Module page */
.mod-header{ margin-bottom:2rem; padding-bottom:1.6rem; border-bottom:1px solid var(--line); }
.mod-eyebrow{ font-family:var(--ff-ui); font-size:0.72rem; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--olive); margin-bottom:0.7rem; display:flex; align-items:center; gap:0.6rem; }
.mod-eyebrow .mins{ color:var(--ink-soft); font-weight:400; text-transform:none; letter-spacing:0; }
.mod-header h1{ font-family:var(--ff-display); font-weight:700; font-size:clamp(1.9rem,4vw,2.5rem); margin-bottom:0.6rem; line-height:1.12; }
.mod-header .sub{ font-family:var(--ff-body); font-style:italic; color:var(--ink-soft); font-size:1.02rem; }

.intro{ font-family:var(--ff-body); font-size:1.03rem; color:var(--ink); margin-bottom:2.2rem; padding-left:1rem; border-left:3px solid var(--apricot); }

.lesson-section{ margin-bottom:2.1rem; }
.lesson-section h2{ font-family:var(--ff-display); font-weight:600; font-size:1.32rem; color:var(--ink); margin-bottom:0.7rem; display:flex; align-items:center; gap:0.55rem; }
.h2-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; display:inline-block; }
.eyebrow-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
.mod-eyebrow{ display:flex; align-items:center; gap:0.5rem; }
.lesson-section p{ font-family:var(--ff-body); font-size:0.98rem; color:var(--ink); margin-bottom:0.85rem; }
.lesson-section p strong{ color:var(--olive-deep); font-weight:700; }

.callout{ display:flex; gap:0.8rem; padding:1rem 1.2rem; border-radius:10px; margin:1.1rem 0 1.4rem; font-family:var(--ff-ui); font-size:0.87rem; line-height:1.6; }
.callout.info{ background:var(--sky-bg); border-left:3px solid var(--olive); color:#0B4A87; }
.callout.warning{ background:var(--ink); border-left:3px solid var(--olive); color:#FFFFFF; }
.callout.warning strong{ color:#8ED2FF; }
.callout .icon{ font-size:1rem; flex-shrink:0; }

.takeaways{ background:var(--melon-bg); border:1px solid var(--melon); border-radius:14px; padding:1.5rem 1.6rem; margin:2.4rem 0 1.6rem; }
.takeaways h3{ font-family:var(--ff-ui); font-size:0.74rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--olive-deep); margin-bottom:0.9rem; }
.takeaways ul{ list-style:none; }
.takeaways li{ font-family:var(--ff-ui); font-size:0.9rem; color:var(--ink); padding-left:1.5rem; position:relative; margin-bottom:0.6rem; line-height:1.55; }
.takeaways li::before{ content:'✓'; position:absolute; left:0; color:var(--olive-deep); font-weight:700; }

.action-box{ background:var(--panel); border:1.5px dashed var(--apricot); border-radius:14px; padding:1.4rem 1.6rem; margin-bottom:2.4rem; }
.action-box .lbl{ font-family:var(--ff-ui); font-size:0.7rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--apricot-deep); margin-bottom:0.5rem; }
.action-box p{ font-family:var(--ff-ui); font-size:0.92rem; color:var(--ink); line-height:1.6; }

.mark-done{ display:inline-flex; align-items:center; gap:0.5rem; font-family:var(--ff-ui); font-size:0.85rem; font-weight:600; border:none; padding:0.65rem 1.1rem; border-radius:9px;  margin-bottom:2rem; transition:transform 0.18s cubic-bezier(.34,1.56,.64,1), background 0.2s ease; }
.mark-done:hover{ transform:scale(1.03); }
.mark-done.is-done{ background:var(--olive) !important; color:#fff !important; }

.mod-nav{ display:flex; justify-content:space-between; gap:1rem; margin-top:2.6rem; padding-top:1.6rem; border-top:1px solid var(--line); }
.mod-nav .side{ font-family:var(--ff-ui); }
.mod-nav a.navbtn{ display:flex; flex-direction:column; gap:0.15rem; padding:0.8rem 1.1rem; border-radius:10px; border:1px solid var(--line); max-width:280px;  }
.mod-nav a.navbtn:hover{ border-color:var(--apricot); }
.mod-nav .navbtn .lbl{ font-size:0.66rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); }
.mod-nav .navbtn .ttl{ font-size:0.88rem; font-weight:600; }
.mod-nav .next{ text-align:right; margin-left:auto; }

/* Glossary */
.glossary-list{ display:flex; flex-direction:column; }
.gterm{ display:grid; grid-template-columns:200px 1fr; gap:1.5rem; padding:1rem 0; border-bottom:1px solid var(--line); }
.gterm dt{ font-family:var(--ff-ui); font-weight:700; font-size:0.92rem; color:var(--olive-deep); }
.gterm dd{ font-family:var(--ff-body); font-size:0.94rem; color:var(--ink); }

footer.site-footer{ margin-top:3rem; padding-top:1.6rem; border-top:1px solid var(--line); font-family:var(--ff-ui); font-size:0.78rem; color:var(--ink-soft); }

/* Mobile */
@media(max-width:860px){
  .shell{ flex-direction:column; }
  .sidebar{
    position:fixed; z-index:50; top:0; left:0; height:100vh; width:80vw; max-width:320px;
    transform:translateX(-100%); transition:transform 0.25s ease; box-shadow:8px 0 30px rgba(0,0,0,0.12);
  }
  .sidebar.open{ transform:translateX(0); }
  .menu-btn{
    display:flex; align-items:center; gap:0.6rem; position:sticky; top:0; z-index:40; background:var(--panel);
    border-bottom:1px solid var(--line); padding:0.9rem 1.2rem; font-family:var(--ff-ui); font-weight:600; font-size:0.9rem; 
  }
  .scrim{ display:none; position:fixed; inset:0; background:rgba(20,15,5,0.35); z-index:45; }
  .scrim.open{ display:block; }
  .content{ padding:2.2rem 1.3rem 4rem; }
  .gterm{ grid-template-columns:1fr; gap:0.3rem; }
  .mod-nav{ flex-direction:column; }
  .mod-nav .navbtn{ max-width:none; }
}

    </div>

<script>
const PAGES = {"foundations":"\n  <div class=\"mod-eyebrow\"><span class=\"eyebrow-dot\" style=\"background:#8ed2ff\"></span><span>Module 1 of 10</span><span class=\"mins\">· 22 min read</span></div>\n  <div class=\"mod-header\" style=\"border-bottom-color:#8ed2ff33\">\n    <h1>Foundations</h1>\n    <div class=\"sub\">What Meta Ads actually are, and how the machine underneath them works.</div>\n  </div>\n  <button class=\"mark-done\" id=\"markDoneBtn\" data-color=\"#8ed2ff\" style=\"background:#8ed2ff22;color:#8ed2ff\" onclick=\"toggleDone('foundations')\">✓ Mark module complete</button>\n  <div class=\"intro\" style=\"border-left-color:#8ed2ff\"><p>Before touching Ads Manager, you need the mental model. Meta Ads aren't one thing — they're a bidding system layered across several apps, judged by an algorithm that has changed more in the last eighteen months than in the previous eight years. Get this chapter right and everything after it clicks into place faster.</p></div>\n  \n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#8ed2ff\"></span>Where Meta Ads actually show up</h2>\n      <p>A single Meta Ads campaign can be delivered across four surfaces: the Facebook feed and Stories, Instagram feed/Stories/Reels, Messenger, and the Audience Network (third-party apps that carry Meta ads). You don't buy these separately — you buy access to Meta's ad system, and placements decide where the creative actually renders.</p><p>Reels and video-first placements now carry the majority of impressions on both apps. If your creative library is still image-only, you're competing for a shrinking share of inventory.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#8ed2ff\"></span>The three-level structure you'll live in</h2>\n      <p>Everything in Ads Manager nests three levels deep. <strong>Campaign</strong> is the objective — what outcome you're telling Meta to chase. <strong>Ad Set</strong> is the audience, placements, budget, and schedule. <strong>Ad</strong> is the actual creative, copy, and destination link.</p><p>Almost every troubleshooting question ('why isn't it spending,' 'why did cost spike') is really a question of <em>which level</em> the problem lives at. Budget and delivery issues live at the Ad Set. Rejection and quality issues live at the Ad. Strategic mismatches live at the Campaign.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#8ed2ff\"></span>How the auction actually decides a winner</h2>\n      <p>Every time someone opens Facebook or Instagram, thousands of ads are eligible to fill that slot. Meta scores each one on <strong>Total Value</strong>: your bid, multiplied by Meta's estimate of how likely <em>this specific person</em> is to take the action you're optimizing for, plus an ad quality score built from real feedback (hides, reports, negative signals).</p><p>The highest Total Value wins — not the highest bid. A cheaper, more relevant ad beats an expensive generic one constantly. This is why creative quality is a cost lever, not a branding nicety.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#8ed2ff\"></span>The 2026 shift: Andromeda changed the rules</h2>\n      <p>In 2025, Meta finished rolling out <strong>Andromeda</strong>, a rebuilt ad-retrieval system running on dramatically more model capacity than what it replaced. The philosophical change matters more than the engineering: Meta stopped asking <em>'does this user match the advertiser's targeting?'</em> and started asking <em>'does this creative match this person's real behavior?'</em></p><p>Practically, that means your targeting settings are now closer to a suggestion than a command — Meta's AI can and will deliver outside your chosen interests if it predicts a better match. Creative is now doing most of the targeting work your audience settings used to do.</p>\n      <div class=\"callout info\"><span class=\"icon\">💡</span><span>This single idea reshapes almost every module after this one. Wherever you see 'targeting' in older Meta Ads material, mentally add: 'less of a lever than it used to be. Creative diversity is the new lever.'</span></div>\n    </div>\n  <div class=\"takeaways\">\n    <h3>Key Takeaways</h3>\n    <ul><li>Meta Ads run across Facebook, Instagram, Messenger, and Audience Network — video/Reels placements now dominate inventory.</li><li>Campaign = objective, Ad Set = audience/budget/placement, Ad = creative. Diagnose problems by level.</li><li>The auction rewards Total Value (bid × predicted action rate × quality), not the highest bid.</li><li>Andromeda (2025–26) shifted Meta from audience-based to creative-based targeting — your ad's content now decides who sees it more than your settings do.</li></ul>\n  </div>\n  <div class=\"action-box\">\n    <div class=\"lbl\">Try This Now</div>\n    <p>Open Meta Ads Manager (even without a live campaign) and just look at the three-level structure — Campaigns tab, then click into an Ad Set, then an Ad. Get the hierarchy into muscle memory before Module 2.</p>\n  </div>\n  <div class=\"mod-nav\">\n    <span></span>\n    <a class=\"navbtn next\" onclick=\"go('setup')\"><span class=\"lbl\">Next →</span><span class=\"ttl\">Account Setup & Infrastructure</span></a>\n  </div>\n  ","setup":"\n  <div class=\"mod-eyebrow\"><span class=\"eyebrow-dot\" style=\"background:#5fb7fe\"></span><span>Module 2 of 10</span><span class=\"mins\">· 20 min read</span></div>\n  <div class=\"mod-header\" style=\"border-bottom-color:#5fb7fe33\">\n    <h1>Account Setup & Infrastructure</h1>\n    <div class=\"sub\">Business Manager, tracking, and the plumbing that has to be right before you spend a dollar.</div>\n  </div>\n  <button class=\"mark-done\" id=\"markDoneBtn\" data-color=\"#5fb7fe\" style=\"background:#5fb7fe22;color:#5fb7fe\" onclick=\"toggleDone('setup')\">✓ Mark module complete</button>\n  <div class=\"intro\" style=\"border-left-color:#5fb7fe\"><p>This is the least exciting module and the one most beginners skip — which is exactly why most beginner accounts have broken tracking within the first week. Get the plumbing right once, and you'll never have to debug 'why don't my numbers match' at 11pm.</p></div>\n  \n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#5fb7fe\"></span>Business Manager vs. Ads Manager</h2>\n      <p><strong>Meta Business Manager</strong> is the umbrella: it holds your ad accounts, Pages, Pixels, and team access in one place. <strong>Ads Manager</strong> is where you actually build and run campaigns, sitting inside Business Manager.</p><p>If you're managing anyone else's ads — a client, an employer — always ask to be added as a <strong>Partner</strong> inside their Business Manager rather than being handed raw login credentials. It's safer for them and it's how agencies operate professionally.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#5fb7fe\"></span>The Meta Pixel and Conversions API — set both up</h2>\n      <p>The <strong>Pixel</strong> is a snippet of code on the website that reports actions (page views, add-to-cart, purchases) from the visitor's browser. The <strong>Conversions API (CAPI)</strong> sends that same event data directly from the server instead — which isn't affected by ad blockers, cookie limits, or browser privacy restrictions.</p><p>Best practice in 2026 is running both together with deduplication enabled: Pixel and CAPI report the same event, Meta merges the duplicates, and your data ends up meaningfully more complete than either source running alone.</p>\n      <div class=\"callout warning\"><span class=\"icon\">⚠</span><span>Never launch a campaign — even a small test — before verifying events are firing in Events Manager. A broken Pixel doesn't look broken. It just looks like the campaign failed.</span></div>\n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#5fb7fe\"></span>Event Match Quality</h2>\n      <p>Meta scores how well the customer information you're sending (email, phone, browser ID) matches a real Facebook/Instagram profile. This score is called <strong>Event Match Quality (EMQ)</strong>, and in the Andromeda era it matters more than ever — clean signal is now a direct input into how well the algorithm can find your buyers.</p><p>Aim for an EMQ score above 7/10 on your key conversion events. Low scores usually trace back to missing customer parameters (email/phone not being passed) rather than a Pixel problem.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#5fb7fe\"></span>Domain verification and the basics people forget</h2>\n      <p>Verify your website domain in Business Manager — this protects your ability to configure conversion events if Meta or a browser restricts tracking further. Also confirm your ad account's currency, timezone, and payment method are correct before your first campaign; timezone mismatches make your day-parting and reporting quietly wrong for months.</p>\n      \n    </div>\n  <div class=\"takeaways\">\n    <h3>Key Takeaways</h3>\n    <ul><li>Business Manager holds the account; Ads Manager is where you build campaigns.</li><li>Run Pixel + Conversions API together with deduplication — never one alone.</li><li>Verify events are firing in Events Manager before spending a single dollar.</li><li>Event Match Quality above 7/10 is the 2026 signal-quality bar to aim for.</li></ul>\n  </div>\n  <div class=\"action-box\">\n    <div class=\"lbl\">Try This Now</div>\n    <p>If you have access to any website (yours, a friend's, a test site), install the Pixel and fire a test event through Events Manager's Test Events tool. If not, at minimum walk through Meta's Events Manager setup flow so the screens are familiar.</p>\n  </div>\n  <div class=\"mod-nav\">\n    <a class=\"navbtn prev\" onclick=\"go('foundations')\"><span class=\"lbl\">← Previous</span><span class=\"ttl\">Foundations</span></a>\n    <a class=\"navbtn next\" onclick=\"go('audiences')\"><span class=\"lbl\">Next →</span><span class=\"ttl\">Audiences & Targeting</span></a>\n  </div>\n  ","audiences":"\n  <div class=\"mod-eyebrow\"><span class=\"eyebrow-dot\" style=\"background:#2f9dfc\"></span><span>Module 3 of 10</span><span class=\"mins\">· 18 min read</span></div>\n  <div class=\"mod-header\" style=\"border-bottom-color:#2f9dfc33\">\n    <h1>Audiences & Targeting</h1>\n    <div class=\"sub\">Core, Custom, Lookalike, Advantage+ — and what targeting is actually for in 2026.</div>\n  </div>\n  <button class=\"mark-done\" id=\"markDoneBtn\" data-color=\"#2f9dfc\" style=\"background:#2f9dfc22;color:#2f9dfc\" onclick=\"toggleDone('audiences')\">✓ Mark module complete</button>\n  <div class=\"intro\" style=\"border-left-color:#2f9dfc\"><p>Targeting used to be the whole game. It isn't anymore — but that doesn't mean it's irrelevant. This module covers the audience types you still need to know, and how to use them the way Andromeda actually rewards: as context, not as a cage.</p></div>\n  \n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#2f9dfc\"></span>The three classic audience types</h2>\n      <p><strong>Core audiences</strong> are built from Meta's own targeting options — location, age, interests, behaviors. <strong>Custom audiences</strong> come from data you already own: website visitors, customer lists, people who engaged with your Page or past ads. <strong>Lookalike audiences</strong> take a strong custom audience — your best customers — and ask Meta to find new people who share similar patterns.</p><p>In practice: Core for early cold prospecting when there's no account data yet, Custom for retargeting warm traffic, Lookalike once you have a source audience of at least a few hundred people to model from.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#2f9dfc\"></span>Advantage+ audience — the 2026 default</h2>\n      <p>Advantage+ audience lets Meta's AI find the right people using signals from your Pixel, your creative, and account history, instead of you manually stacking interests. You can still add light 'audience suggestions' as a steer, but the algorithm ultimately decides who sees the ad.</p><p>Meta's own internal testing found one ad set running 25 diverse creatives to a broad audience outperformed five narrow ad sets running five creatives each — by roughly 17% more conversions at 16% lower cost. Over-segmentation now fights the algorithm by fragmenting the data it needs to learn.</p>\n      <div class=\"callout info\"><span class=\"icon\">💡</span><span>The 2026 rule of thumb: fewer campaigns, fewer ad sets, more creative diversity inside each one, and broader targeting than feels comfortable at first.</span></div>\n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#2f9dfc\"></span>Retargeting still works — arguably better than ever</h2>\n      <p>Build a Custom Audience from a specific high-intent behavior — site visitors in the last 30 days, add-to-cart without purchase — using Pixel/CAPI events, then build creative that speaks directly to where they dropped off, not a repeat of your cold-traffic ad. Exclude anyone who already converted so budget isn't wasted on people who already bought.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#2f9dfc\"></span>Audience overlap — the quiet cost leak</h2>\n      <p>When two of your own ad sets are eligible to reach the same person, they compete against each other in the same auction, driving your own costs up for nothing. Check the Audience Overlap tool periodically. The 2026 fix is usually structural: consolidate into fewer, broader ad sets rather than fighting overlap with more exclusions.</p>\n      \n    </div>\n  <div class=\"takeaways\">\n    <h3>Key Takeaways</h3>\n    <ul><li>Core = Meta's targeting options, Custom = your own data, Lookalike = modeled from your best customers.</li><li>Advantage+ audience is the 2026 default — Meta's AI finds people from creative + Pixel signals.</li><li>Fewer, broader ad sets with more creative diversity now consistently beats narrow segmentation.</li><li>Retargeting is still one of the highest-ROI audiences you can build — just exclude converters.</li></ul>\n  </div>\n  <div class=\"action-box\">\n    <div class=\"lbl\">Try This Now</div>\n    <p>In Ads Manager, open Audience Insights (or the Overlap tool if you have live ad sets) and just explore what a Custom Audience source list looks like versus a Lookalike. Familiarity beats theory here.</p>\n  </div>\n  <div class=\"mod-nav\">\n    <a class=\"navbtn prev\" onclick=\"go('setup')\"><span class=\"lbl\">← Previous</span><span class=\"ttl\">Account Setup & Infrastructure</span></a>\n    <a class=\"navbtn next\" onclick=\"go('campaigns')\"><span class=\"lbl\">Next →</span><span class=\"ttl\">Building Campaigns</span></a>\n  </div>\n  ","campaigns":"\n  <div class=\"mod-eyebrow\"><span class=\"eyebrow-dot\" style=\"background:#0082fb\"></span><span>Module 4 of 10</span><span class=\"mins\">· 20 min read</span></div>\n  <div class=\"mod-header\" style=\"border-bottom-color:#0082fb33\">\n    <h1>Building Campaigns</h1>\n    <div class=\"sub\">Objectives, ABO vs CBO, placements, and structuring your first campaign properly.</div>\n  </div>\n  <button class=\"mark-done\" id=\"markDoneBtn\" data-color=\"#0082fb\" style=\"background:#0082fb22;color:#0082fb\" onclick=\"toggleDone('campaigns')\">✓ Mark module complete</button>\n  <div class=\"intro\" style=\"border-left-color:#0082fb\"><p>This is where strategy becomes a real, live campaign. The goal of this module is simple: by the end, you should be able to build a campaign from a blank Ads Manager screen without guessing at any step.</p></div>\n  \n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#0082fb\"></span>Choosing the right objective</h2>\n      <p>Match the objective to the actual friction point in the funnel. <strong>Awareness</strong> when nobody knows the brand yet. <strong>Traffic or Engagement</strong> for early, low-budget testing. <strong>Leads</strong> when the sale needs a conversation first. <strong>Sales</strong> once the Pixel has enough purchase data to optimize against.</p><p>A common beginner mistake: picking 'Traffic' out of habit for an e-commerce brand that should be on 'Sales' from day one. Meta can only optimize for the outcome you actually tell it to chase.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#0082fb\"></span>ABO vs CBO — and Advantage+ campaign budget</h2>\n      <p><strong>ABO</strong> (Ad Set Budget Optimization) locks a fixed budget to each ad set — you decide exactly how much each audience or creative gets. <strong>CBO</strong>, now folded into what Meta calls <strong>Advantage+ campaign budget</strong>, sets one pool at the campaign level and shifts spend in real time toward whichever ad set is winning.</p><p>Rule of thumb: ABO for structured testing, where you want a fair, forced sample size on each variant. CBO/Advantage+ budget for scaling, once you already know what works and want the algorithm — not you — rebalancing spend.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#0082fb\"></span>Placements: let the algorithm choose</h2>\n      <p>Unless you have a specific reason to restrict delivery (a format that genuinely doesn't work in Stories, for instance), leave placements on <strong>Advantage+ (automatic)</strong>. Manually restricting placements shrinks the data pool the algorithm has to learn from, and in the Andromeda era that's a real cost, not just a minor inefficiency.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#0082fb\"></span>Structuring your first real campaign</h2>\n      <p>One campaign. One or two ad sets. 8–12 distinct creative concepts (not 8 minor variations of one concept) inside those ad sets. Advantage+ audience with light steering if you have any signal on who buys. Advantage+ budget once you've validated the concept with a smaller ABO test.</p><p>Launch with enough budget that the ad set can realistically leave the learning phase within about a week — under-funding a test just produces noise, not a clean answer.</p>\n      <div class=\"callout warning\"><span class=\"icon\">⚠</span><span>Big mistake to avoid: launching one ad set per audience 'just to be safe.' In 2026 this fragments your signal and makes every ad set perform worse than a single, broader one would have.</span></div>\n    </div>\n  <div class=\"takeaways\">\n    <h3>Key Takeaways</h3>\n    <ul><li>Pick the objective that matches your actual funnel friction — not habit.</li><li>ABO for testing, CBO/Advantage+ budget for scaling proven winners.</li><li>Leave placements on Advantage+ automatic unless you have a real reason not to.</li><li>Structure: fewer ad sets, more creative concepts inside each — this is the 2026-native way to build.</li></ul>\n  </div>\n  <div class=\"action-box\">\n    <div class=\"lbl\">Try This Now</div>\n    <p>Sketch out a campaign structure on paper for a hypothetical business (yours, MURAQBA, or a friend's): one objective, one ad set, and eight different creative <em>concepts</em> (not just eight images) you'd want to test.</p>\n  </div>\n  <div class=\"mod-nav\">\n    <a class=\"navbtn prev\" onclick=\"go('audiences')\"><span class=\"lbl\">← Previous</span><span class=\"ttl\">Audiences & Targeting</span></a>\n    <a class=\"navbtn next\" onclick=\"go('budget-bidding')\"><span class=\"lbl\">Next →</span><span class=\"ttl\">Budgets, Bidding & the Auction</span></a>\n  </div>\n  ","budget-bidding":"\n  <div class=\"mod-eyebrow\"><span class=\"eyebrow-dot\" style=\"background:#0078f2\"></span><span>Module 5 of 10</span><span class=\"mins\">· 16 min read</span></div>\n  <div class=\"mod-header\" style=\"border-bottom-color:#0078f233\">\n    <h1>Budgets, Bidding & the Auction</h1>\n    <div class=\"sub\">Bid strategies, the learning phase, and why patience is a real skill here.</div>\n  </div>\n  <button class=\"mark-done\" id=\"markDoneBtn\" data-color=\"#0078f2\" style=\"background:#0078f222;color:#0078f2\" onclick=\"toggleDone('budget-bidding')\">✓ Mark module complete</button>\n  <div class=\"intro\" style=\"border-left-color:#0078f2\"><p>Budget and bidding decisions feel like the 'serious' part of media buying — and beginners often either obsess over them too early or ignore them entirely. This module gives you just enough control to be dangerous, without the false confidence of over-optimizing on day one.</p></div>\n  \n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#0078f2\"></span>The bid strategies available to you</h2>\n      <p><strong>Highest volume / Lowest cost</strong> — Meta spends the full budget chasing as many results as possible. The right default when you don't yet know your target cost. <strong>Cost cap</strong> — keeps average cost per result near a target while still spending the full budget. <strong>Bid cap</strong> — a hard ceiling on any single auction bid; more control, but can restrict delivery if set too tight. <strong>ROAS goal</strong> — for e-commerce, holds spend to a minimum return-on-ad-spend target.</p><p>Start with Lowest Cost to gather data on any new account or offer. Only move to a cap once you actually know what a 'good' number looks like for that specific business.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#0078f2\"></span>The learning phase — don't fight it</h2>\n      <p>Right after launch (or any significant edit), an ad set enters a window where Meta's delivery system is still gathering data on who converts — typically until it hits around 50 optimization events. Performance is usually less stable and more expensive here.</p><p>Big edits — budget swings, new creative, audience changes — reset this window entirely. That's why the standard advice is to make changes in small increments: budget moves of 10–20% every 48–72 hours, not 3x overnight swings.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#0078f2\"></span>Scaling without breaking what's working</h2>\n      <p>Two levers, usually combined. <strong>Vertical scaling</strong>: raise budget gradually (10–20% every 2–3 days) so the algorithm adjusts without a full learning-phase reset. <strong>Horizontal scaling</strong>: duplicate the winning ad set and point the copy at a new audience angle or creative direction, so growth doesn't depend on squeezing one audience harder than it can bear.</p>\n      <div class=\"callout info\"><span class=\"icon\">💡</span><span>Track blended results across the whole account, not one ad set in isolation. A 'declining' top ad set can still mean the account overall is scaling well.</span></div>\n    </div>\n  <div class=\"takeaways\">\n    <h3>Key Takeaways</h3>\n    <ul><li>Start with Lowest Cost bidding until you know your real target numbers.</li><li>The learning phase resets on major edits — make changes in small, spaced increments.</li><li>Scale vertically (budget) and horizontally (new angles/audiences) together, not budget alone.</li><li>Judge performance at the account level, not just the loudest single ad set.</li></ul>\n  </div>\n  <div class=\"action-box\">\n    <div class=\"lbl\">Try This Now</div>\n    <p>If you have a live or past campaign, find the delivery status of an ad set and check whether it says 'Learning' or 'Active.' If you don't have one, read through Meta's own Learning Phase explainer inside Ads Manager's Help Center panel — it's worth having the real language in your head.</p>\n  </div>\n  <div class=\"mod-nav\">\n    <a class=\"navbtn prev\" onclick=\"go('campaigns')\"><span class=\"lbl\">← Previous</span><span class=\"ttl\">Building Campaigns</span></a>\n    <a class=\"navbtn next\" onclick=\"go('creative')\"><span class=\"lbl\">Next →</span><span class=\"ttl\">Creative & Ad Copy</span></a>\n  </div>\n  ","creative":"\n  <div class=\"mod-eyebrow\"><span class=\"eyebrow-dot\" style=\"background:#006ee9\"></span><span>Module 6 of 10</span><span class=\"mins\">· 24 min read</span></div>\n  <div class=\"mod-header\" style=\"border-bottom-color:#006ee933\">\n    <h1>Creative & Ad Copy</h1>\n    <div class=\"sub\">Hooks, testing frameworks, and copywriting that actually earns the click — and the conversion.</div>\n  </div>\n  <button class=\"mark-done\" id=\"markDoneBtn\" data-color=\"#006ee9\" style=\"background:#006ee922;color:#006ee9\" onclick=\"toggleDone('creative')\">✓ Mark module complete</button>\n  <div class=\"intro\" style=\"border-left-color:#006ee9\"><p>In the Andromeda era, creative isn't one input among many — it's the primary lever you actually control. This is the longest module for a reason: everything else in this course exists to get a good creative in front of the right person efficiently. This is what makes that creative good.</p></div>\n  \n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#006ee9\"></span>The hook is the only guaranteed real estate you have</h2>\n      <p>Meta's AI can crop, reorder, and recombine your ad components across placements — but the first 2–3 seconds of a video, or the first line of copy, is still squarely in your control and still decides whether anyone sees the rest. Front-load your sharpest angle there, every time.</p><p>For video: design for sound-off viewing with captions and large readable text. Reels/Stories perform best at 15 seconds or under; feed video can run longer for warm, already-familiar audiences.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#006ee9\"></span>A copywriting framework that holds up: claim → reason → outcome</h2>\n      <p>Across tested frameworks (PAS, AIDA, social proof, conversational), the pattern that actually converts cold traffic shares one trait: lead with the <em>mechanism</em>, not just the benefit. Don't just claim a result — give the reason it's true, then the outcome the reader gets.</p><p>A practical three-part structure that works well on Meta specifically: <strong>hook</strong> (the sharpest version of your angle, in the first ~40 characters) → <strong>proof point</strong> (a specific number or mechanism, not a vague claim) → <strong>friction-free CTA</strong> (one clear next step, no ambiguity).</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#006ee9\"></span>Creative testing — the discipline that separates hobbyists from professionals</h2>\n      <p>Three non-negotiables: <strong>single-variable isolation</strong> (change exactly one thing — hook, visual, angle, or CTA — never several at once), <strong>enough sample size before reading signal</strong> (roughly 400 impressions per variant as a floor, not 100 clicks), and <strong>documented hypotheses</strong> ('this hook should beat control because it leads with a specific number instead of a vague promise' — not just 'let's try this and see').</p><p>Allocate roughly 70% of testing budget to <em>angle</em> testing specifically — message typically produces the biggest swing in performance, bigger than visual style or format.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#006ee9\"></span>Source angles from what's already working — then make it yours</h2>\n      <p>Pull inspiration from ads that have been running 14+ days in the Meta Ad Library — sustained runtime is itself a signal they're converting. After a test, save the <em>winning pattern</em>, not just the winning ad. The learnable thing is the structural type (a number-led hook, a before/after format, a specific proof style) — not the exact wording, which you'll retire within weeks anyway.</p>\n      <div class=\"callout warning\"><span class=\"icon\">⚠</span><span>Don't chase volume for its own sake. The 70/20/10 rule is a good guardrail: 70% of budget on proven creative, 20% on tested variations, 10% on genuinely experimental formats.</span></div>\n    </div>\n  <div class=\"takeaways\">\n    <h3>Key Takeaways</h3>\n    <ul><li>The hook (first 2–3 seconds / first line) is your highest-leverage, fully-controllable asset.</li><li>Structure: hook → proof point (specific, not vague) → friction-free CTA.</li><li>Test one variable at a time, wait for real sample size, and write the hypothesis down before you launch.</li><li>Save winning <em>patterns</em>, not just winning ads — that's what compounds over time.</li></ul>\n  </div>\n  <div class=\"action-box\">\n    <div class=\"lbl\">Try This Now</div>\n    <p>Pick any product or service (real or hypothetical) and write three different hooks for the same offer — each using a different angle (a number, a pain point, a social-proof claim). That's your first real creative test brief.</p>\n  </div>\n  <div class=\"mod-nav\">\n    <a class=\"navbtn prev\" onclick=\"go('budget-bidding')\"><span class=\"lbl\">← Previous</span><span class=\"ttl\">Budgets, Bidding & the Auction</span></a>\n    <a class=\"navbtn next\" onclick=\"go('tracking')\"><span class=\"lbl\">Next →</span><span class=\"ttl\">Tracking, Metrics & Analytics</span></a>\n  </div>\n  ","tracking":"\n  <div class=\"mod-eyebrow\"><span class=\"eyebrow-dot\" style=\"background:#0064e0\"></span><span>Module 7 of 10</span><span class=\"mins\">· 18 min read</span></div>\n  <div class=\"mod-header\" style=\"border-bottom-color:#0064e033\">\n    <h1>Tracking, Metrics & Analytics</h1>\n    <div class=\"sub\">Reading the numbers correctly, and knowing which ones actually matter.</div>\n  </div>\n  <button class=\"mark-done\" id=\"markDoneBtn\" data-color=\"#0064e0\" style=\"background:#0064e022;color:#0064e0\" onclick=\"toggleDone('tracking')\">✓ Mark module complete</button>\n  <div class=\"intro\" style=\"border-left-color:#0064e0\"><p>Every metric in Ads Manager tells you something — but only if you know what question it's actually answering. This module turns the dashboard from a wall of numbers into a diagnostic tool.</p></div>\n  \n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#0064e0\"></span>The core metrics, and what each one really tells you</h2>\n      <p><strong>CTR</strong> (click-through rate) — clicks ÷ impressions. Signals whether the hook and creative are earning attention. <strong>CPC</strong> (cost per click) — spend ÷ clicks. Reflects competition and relevance together. <strong>CPM</strong> (cost per 1,000 impressions) — the 'price of attention' in that auction; rises with competition or an overly narrow audience. <strong>CPA</strong> (cost per acquisition) — spend ÷ conversions. The number the business actually cares about. <strong>ROAS</strong> (return on ad spend) — revenue ÷ spend. Tells you if the campaign is profitable, not just efficient.</p><p>None of these should be read alone. A low CPC with a high CPA usually means the traffic is cheap but wrong — not that the campaign is winning.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#0064e0\"></span>Attribution windows — and why they matter more than people think</h2>\n      <p>The attribution window defines how long after seeing or clicking an ad Meta will still credit it for a conversion — commonly a 7-day click / 1-day view default. A longer click window credits more of the buyer's journey to the ad; a shorter one gives a more conservative, 'did this ad actually cause the sale' read.</p><p>Match the window to the sales cycle. A $15 impulse buy and a $1,500 considered purchase shouldn't be judged on the same clock.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#0064e0\"></span>Reconciling platform numbers against real revenue</h2>\n      <p>Platform-reported conversions and actual backend sales rarely match exactly — especially since iOS privacy changes limited some tracking. If Meta reports 120 purchases but the store confirms 105, trust the store for anything finance cares about.</p><p>Look at <strong>blended ROAS</strong> across all channels rather than platform-reported ROAS alone — Meta will happily take credit for a sale another channel actually influenced.</p>\n      <div class=\"callout info\"><span class=\"icon\">💡</span><span>Build a five-minute weekly habit: pull CPA and blended ROAS, compare to last week, and write one sentence on what changed. That single habit catches more problems early than any dashboard.</span></div>\n    </div>\n  <div class=\"takeaways\">\n    <h3>Key Takeaways</h3>\n    <ul><li>CTR tells you about the hook; CPA and ROAS tell you about the business outcome — read them together, not alone.</li><li>Choose an attribution window that matches the actual sales cycle, not the platform default blindly.</li><li>Reconcile Meta's reported conversions against real backend revenue regularly.</li><li>A five-minute weekly reporting habit beats an elaborate dashboard you never open.</li></ul>\n  </div>\n  <div class=\"action-box\">\n    <div class=\"lbl\">Try This Now</div>\n    <p>If you have access to any ad account (even a demo or a friend's), pull up the columns view and customize it to show CTR, CPC, CPM, CPA, and ROAS side by side. If not, sketch what that table would look like for a hypothetical $500/month campaign.</p>\n  </div>\n  <div class=\"mod-nav\">\n    <a class=\"navbtn prev\" onclick=\"go('creative')\"><span class=\"lbl\">← Previous</span><span class=\"ttl\">Creative & Ad Copy</span></a>\n    <a class=\"navbtn next\" onclick=\"go('troubleshooting')\"><span class=\"lbl\">Next →</span><span class=\"ttl\">Troubleshooting & Optimization</span></a>\n  </div>\n  ","troubleshooting":"\n  <div class=\"mod-eyebrow\"><span class=\"eyebrow-dot\" style=\"background:#0951a6\"></span><span>Module 8 of 10</span><span class=\"mins\">· 20 min read</span></div>\n  <div class=\"mod-header\" style=\"border-bottom-color:#0951a633\">\n    <h1>Troubleshooting & Optimization</h1>\n    <div class=\"sub\">A real decision-tree for when something breaks — because something always eventually breaks.</div>\n  </div>\n  <button class=\"mark-done\" id=\"markDoneBtn\" data-color=\"#0951a6\" style=\"background:#0951a622;color:#0951a6\" onclick=\"toggleDone('troubleshooting')\">✓ Mark module complete</button>\n  <div class=\"intro\" style=\"border-left-color:#0951a6\"><p>Every media buyer, eventually, opens Ads Manager to a number that doesn't make sense. This module is the playbook for that moment — diagnose calmly, in order, instead of panicking and changing five things at once.</p></div>\n  \n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#0951a6\"></span>CPA suddenly tripled overnight — check in this order</h2>\n      <p><strong>First, tracking.</strong> Confirm the Pixel and CAPI events are still firing correctly in Events Manager — a broken tag can look exactly like a performance crash. <strong>Second, creative fatigue.</strong> Rising CPM alongside falling CTR is the classic fingerprint of an audience that's seen the same ad too many times. <strong>Third, external factors.</strong> A new competitor bidding up the auction, a seasonal demand spike, or a recent account edit that quietly reset the learning phase.</p><p>Rule these out in that order before touching the campaign — otherwise you risk 'fixing' something that was never actually broken.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#0951a6\"></span>An ad gets disapproved</h2>\n      <p>Check Account Quality in Business Manager for the specific policy reason — it's usually more precise than the generic rejection message. Fix the actual issue (common ones: restricted claims, a landing-page mismatch, policy-flagged imagery), then use Request Review with a short, specific note about what changed.</p><p>If disapprovals become a recurring pattern rather than a one-off, treat it as a signal to build a pre-launch creative checklist — repeated flags can quietly damage overall account quality.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#0951a6\"></span>A campaign isn't spending its budget at all</h2>\n      <p>Common causes, roughly in order of likelihood: budget or bid cap set too low for the auction; audience overlapping with another active ad set and splitting delivery; targeting too narrow for the algorithm to find enough eligible people; the ad still stuck in the review queue; or a payment method issue at the account level. Ads Manager's delivery status usually names the exact cause directly — check it first.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#0951a6\"></span>Creative fatigue — spot it before it tanks the account</h2>\n      <p>It's when an audience has seen the same ad so many times they stop responding — frequency climbs, CTR drops, CPM creeps up as the algorithm reads lower engagement as lower relevance. Watch frequency (above 3–4 in a short window is a flag) alongside the CTR/CPM trend, and refresh creative before the numbers fully collapse — roughly monthly for smaller budgets, weekly for larger, faster-spending accounts.</p>\n      <div class=\"callout warning\"><span class=\"icon\">⚠</span><span>CTR is strong but conversions are weak? That's not a creative problem. The ad earned the click — the issue lives after it: page speed, offer mismatch, or a confusing checkout. Fix the page before touching the ad.</span></div>\n    </div>\n  <div class=\"takeaways\">\n    <h3>Key Takeaways</h3>\n    <ul><li>Diagnose CPA spikes in order: tracking, then creative fatigue, then external factors.</li><li>Disapprovals: check Account Quality for the real reason, fix it, then request review with specifics.</li><li>No spend usually traces to budget caps, overlap, narrow targeting, or review — delivery status tells you which.</li><li>High CTR + low conversions is a landing page problem, not a creative problem.</li></ul>\n  </div>\n  <div class=\"action-box\">\n    <div class=\"lbl\">Try This Now</div>\n    <p>Write your own one-page 'something's wrong' checklist using the order above. Having it written down — not just understood — is what keeps you calm the first time it happens for real.</p>\n  </div>\n  <div class=\"mod-nav\">\n    <a class=\"navbtn prev\" onclick=\"go('tracking')\"><span class=\"lbl\">← Previous</span><span class=\"ttl\">Tracking, Metrics & Analytics</span></a>\n    <a class=\"navbtn next\" onclick=\"go('scaling')\"><span class=\"lbl\">Next →</span><span class=\"ttl\">Scaling & Strategy</span></a>\n  </div>\n  ","scaling":"\n  <div class=\"mod-eyebrow\"><span class=\"eyebrow-dot\" style=\"background:#133e6d\"></span><span>Module 9 of 10</span><span class=\"mins\">· 18 min read</span></div>\n  <div class=\"mod-header\" style=\"border-bottom-color:#133e6d33\">\n    <h1>Scaling & Strategy</h1>\n    <div class=\"sub\">Growing a winning account without breaking it, and managing more than one at once.</div>\n  </div>\n  <button class=\"mark-done\" id=\"markDoneBtn\" data-color=\"#133e6d\" style=\"background:#133e6d22;color:#133e6d\" onclick=\"toggleDone('scaling')\">✓ Mark module complete</button>\n  <div class=\"intro\" style=\"border-left-color:#133e6d\"><p>Getting one campaign to work is a skill. Growing it — and eventually running several accounts at once — is a different one. This module is about building a repeatable system instead of re-solving the same problem every time.</p></div>\n  \n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#133e6d\"></span>Vertical and horizontal scaling, together</h2>\n      <p><strong>Vertical</strong>: raise budget in small, spaced increments (10–20% every 2–3 days) so the algorithm can adjust without a full learning-phase reset. <strong>Horizontal</strong>: duplicate the winning structure and point it at a new creative angle or a genuinely different audience segment, so growth doesn't rely on squeezing one audience past its ceiling.</p><p>In the Andromeda era, horizontal scaling increasingly means <em>more creative diversity inside the same ad set</em> rather than more ad sets — remember the account structure lesson from Module 3.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#133e6d\"></span>Building a repeatable testing system</h2>\n      <p>The advertisers who consistently win aren't the ones with the best individual creative instincts — they're the ones with the tightest feedback loop between creative output, performance data, and the next brief. That loop, run consistently, becomes a genuine competitive advantage: a library of proven hooks and formats that a competitor starting from zero simply doesn't have.</p>\n      <div class=\"callout info\"><span class=\"icon\">💡</span><span>A simple weekly cadence: Monday — review last week's data and pick one hypothesis. Midweek — launch the test. Following Monday — read results (with real sample size), archive the pattern, repeat.</span></div>\n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#133e6d\"></span>Managing budget pacing and multiple accounts</h2>\n      <p>As you take on more than one account or client, the skill shifts from 'is this one campaign working' to 'is spend pacing correctly across everything I'm responsible for.' Build a simple weekly pacing check — spend-to-date versus monthly budget, by account — so nothing quietly overspends or underspends for two weeks before anyone notices.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#133e6d\"></span>When to walk away from an account or offer</h2>\n      <p>Not every offer is a good fit for paid Meta traffic — thin margins, an unclear value proposition, or a broken landing page will sink even excellent media buying. Recognizing that early, and saying so honestly to a client or employer, is itself a scaling skill: it protects your reputation and your account's average performance.</p>\n      \n    </div>\n  <div class=\"takeaways\">\n    <h3>Key Takeaways</h3>\n    <ul><li>Scale vertically (budget) and horizontally (creative diversity/angles) together, not just one lever.</li><li>A documented weekly test cadence compounds into a real competitive advantage over time.</li><li>Managing multiple accounts is fundamentally a pacing and systems problem, not just more of the same work.</li><li>Knowing when an offer isn't a fit for paid traffic is a skill worth having — and saying out loud.</li></ul>\n  </div>\n  <div class=\"action-box\">\n    <div class=\"lbl\">Try This Now</div>\n    <p>Design your own weekly cadence (even a simple three-line version) for reviewing performance and running one test per week. Write it down — a system you haven't written down isn't a system yet.</p>\n  </div>\n  <div class=\"mod-nav\">\n    <a class=\"navbtn prev\" onclick=\"go('troubleshooting')\"><span class=\"lbl\">← Previous</span><span class=\"ttl\">Troubleshooting & Optimization</span></a>\n    <a class=\"navbtn next\" onclick=\"go('professional')\"><span class=\"lbl\">Next →</span><span class=\"ttl\">Going Professional</span></a>\n  </div>\n  ","professional":"\n  <div class=\"mod-eyebrow\"><span class=\"eyebrow-dot\" style=\"background:#1c2b33\"></span><span>Module 10 of 10</span><span class=\"mins\">· 20 min read</span></div>\n  <div class=\"mod-header\" style=\"border-bottom-color:#1c2b3333\">\n    <h1>Going Professional</h1>\n    <div class=\"sub\">Building a portfolio with no experience, choosing a path, and staying current for the long run.</div>\n  </div>\n  <button class=\"mark-done\" id=\"markDoneBtn\" data-color=\"#1c2b33\" style=\"background:#1c2b3322;color:#1c2b33\" onclick=\"toggleDone('professional')\">✓ Mark module complete</button>\n  <div class=\"intro\" style=\"border-left-color:#1c2b33\"><p>This is the module that turns everything you've learned into an actual career move — whether that's freelancing, an agency job, or an in-house role. It's also the most time-sensitive: Meta changes constantly, and how you stay current matters as much as what you know today.</p></div>\n  \n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#1c2b33\"></span>You can build real experience before you have a client</h2>\n      <p>Run your own small test campaign — a personal project, a friend's small business, even a $5–10/day budget on something you genuinely care about. Document everything: screenshots of setup, before/after metrics, what you tried and why. That documentation is the raw material for your first portfolio, regardless of how small the spend was.</p><p>Offer free or heavily discounted work to one or two small businesses early on specifically to get real, permission-to-share case studies with actual numbers — not to work for free indefinitely.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#1c2b33\"></span>What an actual portfolio looks like with no agency history</h2>\n      <p>Two focused case studies with real numbers consistently outperform ten vague project descriptions. Show specifics: 'Reduced cost per lead from $8.50 to $3.40 while increasing monthly leads from 45 to 127' — not 'improved performance.'</p><p>Practical formats that work well for a first portfolio: a clean Notion page (free, shareable, easy to update), a short branded PDF (4–6 pages, one case study per page), or a complete LinkedIn profile with 2–3 case studies in the Featured section. You don't need a custom website to start.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#1c2b33\"></span>Freelance, agency, or in-house — how to choose</h2>\n      <p><strong>Freelance</strong> offers the fastest path to your first paid work (platforms like Upwork and Fiverr, or direct local outreach) and the most control, but you own client acquisition entirely. <strong>Agency</strong> roles give you structure, mentorship, and access to bigger budgets faster, at the cost of less autonomy early on. <strong>In-house</strong> roles offer the deepest focus on one brand and often the most stability.</p><p>There's no universally 'better' path — the right one depends on whether you currently value speed, structure, or focus more.</p>\n      \n    </div>\n    <div class=\"lesson-section\">\n      <h2><span class=\"h2-dot\" style=\"background:#1c2b33\"></span>Staying current in a platform that never stops changing</h2>\n      <p>Follow Meta's own Business Help Center and official release notes directly, rather than relying only on secondhand blog posts. Treat every account you touch as a live experiment — the platform genuinely teaches faster than any single article can.</p><p>The direction is explicit: Meta is moving toward letting advertisers hand over targeting, budget, and even creative generation almost entirely to AI. That doesn't remove your job — it moves it upstream, into strategy, offer clarity, and creative judgment, since the automation still needs good inputs to work with.</p>\n      <div class=\"callout warning\"><span class=\"icon\">⚠</span><span>Don't let 'I don't have real experience yet' stop you from starting. Clients pay for demonstrated skill and clear communication — not tenure. A documented $50 test campaign, explained clearly, beats a vague claim of '3 years of marketing experience' every time.</span></div>\n    </div>\n  <div class=\"takeaways\">\n    <h3>Key Takeaways</h3>\n    <ul><li>Document small, real campaigns from day one — that's your portfolio raw material, regardless of budget size.</li><li>Two detailed case studies with real numbers beat ten vague bullet points.</li><li>Freelance, agency, and in-house each trade off speed, structure, and focus differently — pick what you value now.</li><li>As AI takes over more of the mechanical work, your edge concentrates in strategy and creative judgment.</li></ul>\n  </div>\n  <div class=\"action-box\">\n    <div class=\"lbl\">Try This Now</div>\n    <p>Draft the outline of your first case study today — even from a hypothetical or tiny real test. One sentence on the starting point, one on what you changed, one on the measurable result. That's the seed of your whole portfolio.</p>\n  </div>\n  <div class=\"mod-nav\">\n    <a class=\"navbtn prev\" onclick=\"go('scaling')\"><span class=\"lbl\">← Previous</span><span class=\"ttl\">Scaling & Strategy</span></a>\n    <a class=\"navbtn next\" onclick=\"go('home')\"><span class=\"lbl\">Finished!</span><span class=\"ttl\">Back to overview</span></a>\n  </div>\n  ","home":"\n  <div class=\"hero\">\n    <div class=\"hero-eyebrow\">A Free, Self-Paced Course</div>\n    <h1>Meta Ads, from <em>zero</em> to <em>hero</em>.</h1>\n    <p class=\"lede\">Adscend is a ten-module path from \"what is a Pixel\" to running real, profitable campaigns — rebuilt for the 2026 Meta Ads landscape, including the Andromeda shift that changed how targeting actually works.</p>\n    <button class=\"btn\" onclick=\"go('foundations')\">Begin Module 1 →</button>\n    <a class=\"btn ghost\" style=\"margin-left:0.7rem\" onclick=\"go('glossary')\">Browse glossary</a>\n  </div>\n  <div class=\"stat-strip\">\n    <div class=\"stat\"><b>10</b><span>Modules</span></div>\n    <div class=\"stat\"><b>196</b><span>Minutes total</span></div>\n    <div class=\"stat\"><b>2026</b><span>Updated for Andromeda</span></div>\n  </div>\n  <div class=\"mod-grid\">\n    <div class=\"mod-card\" onclick=\"go('foundations')\">\n      <div class=\"num\" style=\"color:#8ed2ff\">01</div>\n      <div class=\"txt\"><h3>Foundations</h3><p>What Meta Ads actually are, and how the machine underneath them works.</p></div>\n      <div class=\"mins\">22 min</div>\n    </div>\n    <div class=\"mod-card\" onclick=\"go('setup')\">\n      <div class=\"num\" style=\"color:#5fb7fe\">02</div>\n      <div class=\"txt\"><h3>Account Setup & Infrastructure</h3><p>Business Manager, tracking, and the plumbing that has to be right before you spend a dollar.</p></div>\n      <div class=\"mins\">20 min</div>\n    </div>\n    <div class=\"mod-card\" onclick=\"go('audiences')\">\n      <div class=\"num\" style=\"color:#2f9dfc\">03</div>\n      <div class=\"txt\"><h3>Audiences & Targeting</h3><p>Core, Custom, Lookalike, Advantage+ — and what targeting is actually for in 2026.</p></div>\n      <div class=\"mins\">18 min</div>\n    </div>\n    <div class=\"mod-card\" onclick=\"go('campaigns')\">\n      <div class=\"num\" style=\"color:#0082fb\">04</div>\n      <div class=\"txt\"><h3>Building Campaigns</h3><p>Objectives, ABO vs CBO, placements, and structuring your first campaign properly.</p></div>\n      <div class=\"mins\">20 min</div>\n    </div>\n    <div class=\"mod-card\" onclick=\"go('budget-bidding')\">\n      <div class=\"num\" style=\"color:#0078f2\">05</div>\n      <div class=\"txt\"><h3>Budgets, Bidding & the Auction</h3><p>Bid strategies, the learning phase, and why patience is a real skill here.</p></div>\n      <div class=\"mins\">16 min</div>\n    </div>\n    <div class=\"mod-card\" onclick=\"go('creative')\">\n      <div class=\"num\" style=\"color:#006ee9\">06</div>\n      <div class=\"txt\"><h3>Creative & Ad Copy</h3><p>Hooks, testing frameworks, and copywriting that actually earns the click — and the conversion.</p></div>\n      <div class=\"mins\">24 min</div>\n    </div>\n    <div class=\"mod-card\" onclick=\"go('tracking')\">\n      <div class=\"num\" style=\"color:#0064e0\">07</div>\n      <div class=\"txt\"><h3>Tracking, Metrics & Analytics</h3><p>Reading the numbers correctly, and knowing which ones actually matter.</p></div>\n      <div class=\"mins\">18 min</div>\n    </div>\n    <div class=\"mod-card\" onclick=\"go('troubleshooting')\">\n      <div class=\"num\" style=\"color:#0951a6\">08</div>\n      <div class=\"txt\"><h3>Troubleshooting & Optimization</h3><p>A real decision-tree for when something breaks — because something always eventually breaks.</p></div>\n      <div class=\"mins\">20 min</div>\n    </div>\n    <div class=\"mod-card\" onclick=\"go('scaling')\">\n      <div class=\"num\" style=\"color:#133e6d\">09</div>\n      <div class=\"txt\"><h3>Scaling & Strategy</h3><p>Growing a winning account without breaking it, and managing more than one at once.</p></div>\n      <div class=\"mins\">18 min</div>\n    </div>\n    <div class=\"mod-card\" onclick=\"go('professional')\">\n      <div class=\"num\" style=\"color:#1c2b33\">10</div>\n      <div class=\"txt\"><h3>Going Professional</h3><p>Building a portfolio with no experience, choosing a path, and staying current for the long run.</p></div>\n      <div class=\"mins\">20 min</div>\n    </div></div>\n  <footer class=\"site-footer\">Adscend — built for anyone starting from absolute zero. No prior marketing background required.</footer>\n  ","glossary":"\n    <div class=\"hero-eyebrow\">Reference</div>\n    <h1 style=\"font-family:var(--ff-display);font-weight:700;font-size:2.1rem;margin-bottom:1.6rem;\">Glossary</h1>\n    <dl class=\"glossary-list\"><div class=\"gterm\"><dt>Ads Manager</dt><dd>Meta's interface for building, running, and reporting on ad campaigns.</dd></div><div class=\"gterm\"><dt>Business Manager</dt><dd>The umbrella account holding your ad accounts, Pages, Pixels, and team access.</dd></div><div class=\"gterm\"><dt>Campaign / Ad Set / Ad</dt><dd>The three-level structure of every Meta campaign: objective, then audience/budget, then creative.</dd></div><div class=\"gterm\"><dt>Meta Pixel</dt><dd>Website code that reports visitor actions back to Meta from the browser.</dd></div><div class=\"gterm\"><dt>Conversions API (CAPI)</dt><dd>Server-side event reporting that complements the Pixel and isn't blocked by browser privacy limits.</dd></div><div class=\"gterm\"><dt>Event Match Quality (EMQ)</dt><dd>A 0–10 score of how well your sent customer data matches a real Meta profile; aim above 7.</dd></div><div class=\"gterm\"><dt>ABO / CBO</dt><dd>Ad Set Budget Optimization (fixed per ad set) vs Campaign Budget Optimization (one pool, algorithm allocates).</dd></div><div class=\"gterm\"><dt>Advantage+ audience</dt><dd>Meta's AI-driven audience targeting, using Pixel and creative signals instead of manual interest stacking.</dd></div><div class=\"gterm\"><dt>Andromeda</dt><dd>Meta's 2025–26 AI ad-retrieval system that shifted targeting from audience-based to creative-based matching.</dd></div><div class=\"gterm\"><dt>Learning phase</dt><dd>The unstable window after launch/major edit while Meta's algorithm gathers enough data to optimize delivery.</dd></div><div class=\"gterm\"><dt>CTR / CPC / CPM / CPA / ROAS</dt><dd>Click-through rate, cost per click, cost per 1,000 impressions, cost per acquisition, return on ad spend.</dd></div><div class=\"gterm\"><dt>Attribution window</dt><dd>How long after an ad interaction Meta will still credit it for a resulting conversion.</dd></div><div class=\"gterm\"><dt>Creative fatigue</dt><dd>Performance decline from an audience seeing the same ad too many times — rising frequency, falling CTR.</dd></div><div class=\"gterm\"><dt>Audience overlap</dt><dd>When two of your own ad sets compete for the same people, quietly driving up your own costs.</dd></div><div class=\"gterm\"><dt>Total Value</dt><dd>The auction score Meta uses to pick a winning ad: bid × predicted action rate × ad quality.</dd></div></dl>\n  "};

const MODULE_IDS = ["foundations","setup","audiences","campaigns","budget-bidding","creative","tracking","troubleshooting","scaling","professional"];

function getDone(){ try{ return JSON.parse(localStorage.getItem('adscend_done')||'[]'); }catch(e){ return []; } }
function setDone(arr){ localStorage.setItem('adscend_done', JSON.stringify(arr)); }

function renderNav(){
  document.getElementById('navList').innerHTML = "<div class=\"nav-label\">Course</div><div class=\"nav-item\" data-route=\"home\" onclick=\"go('home')\"><span class=\"nav-num\">🏠</span><span class=\"nav-title\">Overview</span></div><div class=\"nav-item\" data-route=\"foundations\" onclick=\"go('foundations')\"><span class=\"nav-num\">1</span><span class=\"nav-title\">Foundations</span></div><div class=\"nav-item\" data-route=\"setup\" onclick=\"go('setup')\"><span class=\"nav-num\">2</span><span class=\"nav-title\">Account Setup & Infrastructure</span></div><div class=\"nav-item\" data-route=\"audiences\" onclick=\"go('audiences')\"><span class=\"nav-num\">3</span><span class=\"nav-title\">Audiences & Targeting</span></div><div class=\"nav-item\" data-route=\"campaigns\" onclick=\"go('campaigns')\"><span class=\"nav-num\">4</span><span class=\"nav-title\">Building Campaigns</span></div><div class=\"nav-item\" data-route=\"budget-bidding\" onclick=\"go('budget-bidding')\"><span class=\"nav-num\">5</span><span class=\"nav-title\">Budgets, Bidding & the Auction</span></div><div class=\"nav-item\" data-route=\"creative\" onclick=\"go('creative')\"><span class=\"nav-num\">6</span><span class=\"nav-title\">Creative & Ad Copy</span></div><div class=\"nav-item\" data-route=\"tracking\" onclick=\"go('tracking')\"><span class=\"nav-num\">7</span><span class=\"nav-title\">Tracking, Metrics & Analytics</span></div><div class=\"nav-item\" data-route=\"troubleshooting\" onclick=\"go('troubleshooting')\"><span class=\"nav-num\">8</span><span class=\"nav-title\">Troubleshooting & Optimization</span></div><div class=\"nav-item\" data-route=\"scaling\" onclick=\"go('scaling')\"><span class=\"nav-num\">9</span><span class=\"nav-title\">Scaling & Strategy</span></div><div class=\"nav-item\" data-route=\"professional\" onclick=\"go('professional')\"><span class=\"nav-num\">10</span><span class=\"nav-title\">Going Professional</span></div><div class=\"nav-label\">Reference</div><div class=\"nav-item\" data-route=\"glossary\" onclick=\"go('glossary')\"><span class=\"nav-num\">§</span><span class=\"nav-title\">Glossary</span></div>";
}

function updateProgress(){
  const done = getDone();
  const count = MODULE_IDS.filter(id=>done.includes(id)).length;
  document.getElementById('progressText').textContent = count + ' / ' + MODULE_IDS.length;
  document.getElementById('progressFill').style.width = (count/MODULE_IDS.length*100) + '%';
  document.querySelectorAll('.nav-item').forEach(el=>{
    const r = el.getAttribute('data-route');
    el.classList.toggle('done', done.includes(r));
  });
}

const CONFETTI_COLORS = ["#0082FB","#0064E0","#1C2B33","#FFFFFF","#8ED2FF","#3AA6FF","#0056BE"];
function fireConfetti(){
  const count = 28;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const size = 6 + Math.random()*7;
    el.style.left = Math.random()*100 + 'vw';
    el.style.width = size + 'px';
    el.style.height = (size*0.55) + 'px';
    el.style.background = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    el.style.animationDuration = (1.4 + Math.random()*1.1) + 's';
    el.style.animationDelay = (Math.random()*0.25) + 's';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3000);
  }
}

function toggleDone(id){
  let done = getDone();
  const wasDone = done.includes(id);
  if(wasDone) done = done.filter(x=>x!==id);
  else done.push(id);
  setDone(done);
  updateProgress();
  const btn = document.getElementById('markDoneBtn');
  if(btn){
    const isDone = done.includes(id);
    btn.classList.toggle('is-done', isDone);
    btn.innerHTML = isDone ? '✓ Completed' : '✓ Mark module complete';
    if(isDone && !wasDone) fireConfetti();
  }
}

function closeMenu(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); }
function openMenu(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('scrim').classList.add('open'); }

function go(route){
  if(!ROUTES.includes(route)) route = 'home';
  window.location.hash = route;
}

function render(){
  let route = window.location.hash.replace('#','') || 'home';
  if(!ROUTES.includes(route)) route = 'home';
  document.getElementById('content').innerHTML = PAGES[route];
  document.getElementById('mobileTitle').textContent = TITLES[route];
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.getAttribute('data-route') === route);
  });
  const btn = document.getElementById('markDoneBtn');
  if(btn){
    const id = route;
    const isDone = getDone().includes(id);
    btn.classList.toggle('is-done', isDone);
    btn.innerHTML = isDone ? '✓ Completed' : '✓ Mark module complete';
  }
  updateProgress();
  closeMenu();
  window.scrollTo(0,0);
}

renderNav();
window.addEventListener('hashchange', render);
render();
</script>
</body>
